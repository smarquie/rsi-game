[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-game"
version = "0.5.0"
description = "Continuous decentralized functions game with preserved v0.1 snapshot simulator"
requires-python = ">=3.11"
dependencies = ["numpy>=1.23,<3", "scipy>=1.10,<2", "networkx>=2.8,<4"]

[project.optional-dependencies]
reports = ["matplotlib>=3.6", "pyarrow>=10", "scikit-learn>=1.2,<2"]

[project.scripts]
rsi-game = "rsi_game.v05.cli:main"
rsi-game-v04 = "rsi_game.v04.cli:main"
rsi-game-v01 = "rsi_game.run:main"

[tool.setuptools.packages.find]
include = ["rsi_game*"]

[tool.setuptools.package-data]
rsi_game = ["lab.html"]
"rsi_game.v04" = ["lab.html"]
